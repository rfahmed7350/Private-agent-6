name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4


    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17


    - name: Extract Project ZIP
      run: |
        mkdir project
        unzip *.zip -d project


    - name: Find Project Folder
      run: |
        ls -R project


    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4


    - name: Build Client APK
      run: |
        cd project
        gradle :client:assembleDebug


    - name: Build Admin APK
      run: |
        cd project
        gradle :admin:assembleDebug


    - name: Upload Client APK
      uses: actions/upload-artifact@v4
      with:
        name: Client-APK
        path: |
          project/**/client/build/outputs/apk/debug/*.apk


    - name: Upload Admin APK
      uses: actions/upload-artifact@v4
      with:
        name: Admin-APK
        path: |
          project/**/admin/build/outputs/apk/debug/*.apk
