name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build Client APK
      run: gradle :client:assembleDebug

    - name: Build Admin APK
      run: gradle :admin:assembleDebug

    - name: Upload Client APK
      uses: actions/upload-artifact@v4
      with:
        name: client-apk
        path: client/build/outputs/apk/debug/*.apk

    - name: Upload Admin APK
      uses: actions/upload-artifact@v4
      with:
        name: admin-apk
        path: admin/build/outputs/apk/debug/*.apk
