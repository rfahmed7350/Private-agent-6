name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Find Gradle Project
      run: |
        echo "Searching..."
        find . -name settings.gradle -o -name settings.gradle.kts

    - name: Build Client
      run: |
        ROOT=$(dirname $(find . -name settings.gradle | head -1))
        echo "Gradle root: $ROOT"
        cd "$ROOT"
        gradle :client:assembleDebug

    - name: Build Admin
      run: |
        ROOT=$(dirname $(find . -name settings.gradle | head -1))
        cd "$ROOT"
        gradle :admin:assembleDebug

    - name: Upload Client APK
      uses: actions/upload-artifact@v4
      with:
        name: Client-APK
        path: "**/client/build/outputs/apk/debug/*.apk"

    - name: Upload Admin APK
      uses: actions/upload-artifact@v4
      with:
        name: Admin-APK
        path: "**/admin/build/outputs/apk/debug/*.apk"
